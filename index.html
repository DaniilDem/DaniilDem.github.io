            caches.keys().then(function (keys) {
                keys.forEach(function (key) {
                    caches.delete(key);

    <script>
        (function () {
            var triggers = document.querySelectorAll('[data-address]');
            var status = document.getElementById('support-status');
            if (!triggers.length || !status) return;

            var timer;

            function showCopied() {
                status.textContent = 'Copied';
                clearTimeout(timer);
                timer = setTimeout(function () {
                    status.textContent = '';
                }, 1600);
            }

            function fallbackSelect(el) {
                var range = document.createRange();
                range.selectNodeContents(el);
                var sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(range);
                status.textContent = 'Select and copy address';
            }

            function copyFrom(el) {
                var address = el.getAttribute('data-address') || '';
                if (!address) return;

                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(address).then(showCopied).catch(function () {
                        fallbackSelect(el);
                    });
                    return;
                }

                fallbackSelect(el);
            }

            Array.prototype.forEach.call(triggers, function (el) {
                el.addEventListener('click', function () {
                    copyFrom(el);
                });
            });
        })();
    </script>
    <script defer src="dist/js/space-shatter.js"></script>
